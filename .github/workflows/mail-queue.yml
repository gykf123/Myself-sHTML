name: 发送公告邮件队列

# FeSui 邮件队列的兜底 worker。
# 现在 fs-notify 发布公告时直接用 Resend HTTPS API 发出，不再依赖本 workflow；
# 这里只负责清掉队列里残留的待发邮件，默认同样走 Resend（自发自收的新浪 SMTP
# 会被收件方静默丢弃，队列显示 sent 但用户收不到）。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   SUPABASE_SERVICE_ROLE_KEY  Supabase → Project Settings → API → service_role
#   RESEND_API_KEY             Resend 发信 key
# 可选 Variables：
#   MAIL_PROVIDER  默认 resend；设 smtp 才回退到旧通道
#   FS_MAIL_FROM   默认 onboarding@resend.dev；自有域名验证通过后改成自有发件地址
#   SMTP_HOST / SMTP_PORT / SMTP_SECURE / SMTP_FROM
# 旧 SMTP 通道还需要 SINA_SMTP_USER / SINA_SMTP_PASS 两个 Secrets。
#
# 首次配置完成后，直接在本 workflow 页面点「Run workflow」立即验证，
# 不必等定时任务（本仓库实测 schedule 长期 0 次触发）。

on:
  schedule:
    - cron: "*/15 * * * *"   # 每 15 分钟（GitHub 不保证准时，通常有 3–15 分钟延迟）
  workflow_dispatch:          # 手动触发：配好 Secrets 后立刻跑一次

# 防止 cron 与手动触发重叠导致同一封邮件被发两次
concurrency:
  group: fs-mail-queue
  cancel-in-progress: false

permissions:
  contents: read             # 最小权限，只读代码

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装发信依赖
        working-directory: supabase/mail-relay
        run: npm ci --no-audit --no-fund

      - name: 发送队列邮件
        working-directory: supabase/mail-relay
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SINA_SMTP_USER: ${{ secrets.SINA_SMTP_USER }}
          SINA_SMTP_PASS: ${{ secrets.SINA_SMTP_PASS }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER }}
          FS_MAIL_FROM: ${{ vars.FS_MAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
        run: node send-queue.mjs
