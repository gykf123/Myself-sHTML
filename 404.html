<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · 页面走丢了 · FeSui</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./style.css?v=20261121d" />
  <noscript><style>body{background:#0b0f18;color:#e8ecf5}</style></noscript>
  <script>try{var t=localStorage.getItem('theme')||'glass';if(t==='glass')document.documentElement.classList.add('theme-glass');}catch(e){document.documentElement.classList.add('theme-glass');}</script>
  <style>
    /* 居中交给外层，卡片自己只留内容高度：min-height:100vh 会让卡片跟着视口拉满 */
    .nf-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    .nf { text-align: center; }
    @media (max-width: 420px){ .nf.glass { padding: 32px 20px; } }
    .nf .code { font-size: clamp(56px, 16vw, 84px); font-weight: 800; letter-spacing: 4px; margin: 0; color: var(--accent); }
    .nf .msg { font-size: 16px; color: var(--text-dim); margin: 8px 0 22px; }
    .nf .home {
      display: inline-block; padding: 10px 22px; border-radius: 999px; text-decoration: none; font-weight: 600;
      color: #fff; background: var(--accent); box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent);
    }
  </style>
  <script src="/net-guard.js?v=20261122a"></script>
  <script src="/site-nav.js?v=20261128"></script>
  <link rel="stylesheet" href="fs-skin.css?v=20261122c" />
  <script src="fs-icons.js?v=20261121a" defer></script>
</head>
<body>
  <div class="nf-wrap">
    <div class="nf glass" style="width:min(440px,92vw);border-radius:18px;">
      <h1 class="code">404</h1>
      <p class="msg">这个页面好像被红石电路烧穿了。<br />别急，主页还在。</p>
      <a class="home" href="./">← 返回 FeSui 主页</a>
    </div>
  </div>
  <script src="/visit.js?v=20261107" defer></script>
</body>
</html>
