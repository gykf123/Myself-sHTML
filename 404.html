<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · 页面走丢了 · FeSui</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./style.css" />
  <script>try{var t=localStorage.getItem('theme')||'glass';if(t==='glass')document.documentElement.classList.add('theme-glass');}catch(e){document.documentElement.classList.add('theme-glass');}</script>
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    .nf .code { font-size: 84px; font-weight: 800; letter-spacing: 4px; margin: 0; color: var(--accent); }
    .nf .msg { font-size: 16px; color: var(--text-dim); margin: 8px 0 22px; }
    .nf .home {
      display: inline-block; padding: 10px 22px; border-radius: 999px; text-decoration: none; font-weight: 600;
      color: #fff; background: var(--accent); box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent);
    }
  </style>
</head>
<body>
  <div class="nf glass" style="width:min(440px,92vw);border-radius:18px;padding:40px 28px;">
    <p class="code">404</p>
    <p class="msg">这个页面好像被红石电路烧穿了。<br />别急，主页还在。</p>
    <a class="home" href="./">← 返回 FeSui 主页</a>
  </div>
</body>
</html>
