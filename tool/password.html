<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密码生成器 · FeSui 工具箱</title>
<meta name="referrer" content="no-referrer">
<meta name="description" content="随机强密码生成，可调长度与字符集，支持排除易混字符与强度评估，纯前端离线可用">
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="./toolkit.css?v=20261030">
</head>
<body>
<header class="tk-header">
  <a class="tk-back" href="./index.html">← 工具箱</a>
  <h1 class="tk-h1">🔐 密码生成器</h1>
  <span class="tk-badge">纯前端 · 离线可用</span>
</header>
<main class="tk-main">
  <p class="tk-intro">生成随机强口令。所有运算在本地完成，不上传任何数据。</p>

  <section class="tk-card">
    <h2 class="tk-card-h"><span class="ico">🎯</span>生成选项</h2>
    <div class="tk-row">
      <div class="tk-col">
        <label class="tk-label" for="lenNum">长度：<b id="lenLabel">16</b></label>
        <input class="tk-num" id="lenNum" type="number" min="4" max="64" value="16" />
      </div>
      <div class="tk-col" style="flex:2">
        <label class="tk-label">长度调节（4 - 64）</label>
        <input id="lenRange" type="range" min="4" max="64" value="16" style="width:100%; accent-color:var(--accent); margin-top:8px;" />
      </div>
    </div>

    <div class="tk-row" style="margin-top:14px">
      <div class="tk-col">
        <span class="tk-label">字符集</span>
        <div class="tk-checks">
          <label class="tk-check"><input type="checkbox" id="cUpper" checked /> 大写字母 A-Z</label>
          <label class="tk-check"><input type="checkbox" id="cLower" checked /> 小写字母 a-z</label>
          <label class="tk-check"><input type="checkbox" id="cDigit" checked /> 数字 0-9</label>
          <label class="tk-check"><input type="checkbox" id="cSym" checked /> 符号 !@#$…</label>
        </div>
      </div>
    </div>

    <div class="tk-row" style="margin-top:6px">
      <div class="tk-col">
        <div class="tk-checks">
          <label class="tk-check"><input type="checkbox" id="cExclude" /> 排除易混字符（0O1lI|` 等）</label>
          <label class="tk-check"><input type="checkbox" id="cUnique" /> 不重复字符</label>
        </div>
      </div>
    </div>
  </section>

  <section class="tk-card">
    <h2 class="tk-card-h"><span class="ico">🔑</span>生成的口令</h2>
    <div class="tk-row">
      <div class="tk-col">
        <input class="tk-input" id="pwOut" type="password" readonly value="" placeholder="点击「重新生成」生成口令" />
      </div>
      <div class="tk-col" style="flex:0 0 auto">
        <button class="tk-btn sm" id="toggle" title="显示/隐藏">👁 显示</button>
      </div>
    </div>
    <div class="tk-meter" aria-hidden="true"><i id="meterFill"></i></div>
    <div class="tk-strength-label" id="strengthLabel">强度：—</div>
    <div class="tk-row" style="margin-top:12px">
      <button class="tk-btn primary" id="regen">🔄 重新生成</button>
      <button class="tk-btn ghost" id="copy">复制</button>
    </div>
    <div class="tk-result" id="status" style="margin-top:12px">—</div>
  </section>
</main>
<div class="tk-toast" id="toast"></div>
<footer class="tk-foot">© 2026 FeSui · <a href="./index.html">返回工具箱</a></footer>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var toast = $("toast"), toastTimer;
  function showToast(m){ toast.textContent=m; toast.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){toast.classList.remove("show");},1600); }
  function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(function(){});} else {var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);} }

  var SETS = {
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    lower: "abcdefghijklmnopqrstuvwxyz",
    digit: "0123456789",
    sym:   "!@#$%^&*()-_=+[]{};:,.<>?/"
  };
  var AMBIG = "0O1lI|`\"'"; // 易混字符

  var lenNum = $("lenNum"), lenRange = $("lenRange"), lenLabel = $("lenLabel");

  function syncLen(v){
    v = Math.max(4, Math.min(64, parseInt(v,10) || 16));
    lenNum.value = v; lenRange.value = v; lenLabel.textContent = v;
    return v;
  }
  lenNum.addEventListener("input", function(){ syncLen(lenNum.value); generate(); });
  lenRange.addEventListener("input", function(){ syncLen(lenRange.value); generate(); });
  ["cUpper","cLower","cDigit","cSym","cExclude","cUnique"].forEach(function(id){
    $(id).addEventListener("change", generate);
  });

  function activePools(){
    var excl = $("cExclude").checked;
    var pools = [];
    [["cUpper","upper"],["cLower","lower"],["cDigit","digit"],["cSym","sym"]].forEach(function(p){
      if ($(p[0]).checked){
        var s = SETS[p[1]];
        if (excl){ s = s.split("").filter(function(c){ return AMBIG.indexOf(c)<0; }).join(""); }
        if (s.length) pools.push(s);
      }
    });
    return pools;
  }

  function randInt(max){ return Math.floor(Math.random() * max); }

  function generate(){
    var status = $("status");
    var len = syncLen(lenNum.value);
    var pools = activePools();
    if (pools.length === 0){
      $("pwOut").value = "";
      $("regen").disabled = false;
      setStrength(0);
      status.innerHTML = '<span class="tk-err">✗ 请至少开启一种字符集</span>';
      return;
    }
    var full = pools.join("");
    if ($("cUnique").checked && full.length < len){
      $("pwOut").value = "";
      setStrength(0);
      status.innerHTML = '<span class="tk-err">✗ 「不重复字符」要求可用字符数（'+full.length+'）不少于长度（'+len+'）</span>';
      return;
    }
    status.innerHTML = '<span class="tk-ok">✓ 已生成</span>';

    var chars;
    if ($("cUnique").checked){
      // 从各池抽取保证覆盖，再补足，最后打乱
      var all = full.split("");
      // Fisher-Yates
      for (var i=all.length-1;i>0;i--){ var j=randInt(i+1); var t=all[i]; all[i]=all[j]; all[j]=t; }
      chars = all.slice(0, len);
    } else {
      chars = [];
      for (var k=0;k<len;k++){ chars.push(full.charAt(randInt(full.length))); }
      // 保证每种已选字符集至少出现一次
      for (var p=0;p<pools.length;p++){
        if (len > pools.length){
          var pos = randInt(len);
          chars[pos] = pools[p].charAt(randInt(pools[p].length));
        }
      }
    }
    var pwd = chars.join("");
    $("pwOut").value = pwd;
    setStrength(estimate(len, pools.length, $("cUnique").checked));
  }

  function estimate(len, poolCount, unique){
    // 熵估算：熵 = len * log2(字符空间)；再映射到 0-100
    var space = 0;
    [["cUpper","upper"],["cLower","lower"],["cDigit","digit"],["cSym","sym"]].forEach(function(p){
      if ($(p[0]).checked){ var s=SETS[p[1]]; if($("cExclude").checked) s=s.split("").filter(function(c){return AMBIG.indexOf(c)<0;}).join(""); space += s.length; }
    });
    if (space === 0) return {p:0,label:"—"};
    var entropy = len * Math.log(space) / Math.log(2);
    // 经验阈值：<40 弱，<60 中，<80 强，>=80 极强
    var pct = Math.max(0, Math.min(100, Math.round(entropy / 1.1)));
    var label, color;
    if (entropy < 40){ label="弱"; color="var(--err)"; }
    else if (entropy < 64){ label="中"; color="var(--warn)"; }
    else if (entropy < 90){ label="强"; color="var(--accent2)"; }
    else { label="极强"; color="var(--accent2)"; }
    return {p:pct, label:label, color:color, entropy:entropy};
  }

  function setStrength(info){
    var fill = $("meterFill");
    if (!info || info.p <= 0){
      fill.style.width = "0%"; fill.style.background = "var(--border)";
      $("strengthLabel").textContent = "强度：—";
      return;
    }
    fill.style.width = info.p + "%";
    fill.style.background = info.color;
    $("strengthLabel").innerHTML = '强度：<span style="color:'+info.color+'">'+info.label+'</span>　约熵 '+Math.round(info.entropy)+' bit';
  }

  // 显示/隐藏
  var visible = false;
  $("toggle").addEventListener("click", function(){
    visible = !visible;
    $("pwOut").type = visible ? "text" : "password";
    this.textContent = visible ? "🙈 隐藏" : "👁 显示";
  });

  $("regen").addEventListener("click", function(){ generate(); showToast("已重新生成"); });
  $("copy").addEventListener("click", function(){
    var t = $("pwOut").value;
    if (!t){ showToast("请先生成口令"); return; }
    copyText(t); showToast("已复制口令");
  });

  generate();
})();
</script>
</body>
</html>
