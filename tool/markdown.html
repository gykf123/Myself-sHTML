<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 预览 · FeSui 工具箱</title>
<meta name="referrer" content="no-referrer">
<meta name="description" content="Markdown 实时预览，自写零依赖解析器，XSS 安全，纯前端离线可用">
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="./toolkit.css?v=20261030">
<style>
  /* 仅本页渲染区样式，沿用 CSS 变量，浅色模式自动适配 */
  .md-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .md-wrap{ grid-template-columns:1fr; } }
  .md-side{ display:flex; flex-direction:column; min-width:0; }
  .md-side .tk-textarea{ flex:1; min-height:340px; }
  .md-preview{
    min-height:340px; max-height:520px; overflow:auto;
    border:1px solid var(--border); border-radius:10px; background:var(--panel2);
    padding:14px 16px; line-height:1.7; word-break:break-word;
  }
  .md-preview h1,.md-preview h2,.md-preview h3,.md-preview h4,.md-preview h5,.md-preview h6{
    line-height:1.3; margin:1.1em 0 .5em; font-weight:650; }
  .md-preview h1{ font-size:1.6em; border-bottom:1px solid var(--border); padding-bottom:.25em; }
  .md-preview h2{ font-size:1.35em; border-bottom:1px solid var(--border); padding-bottom:.2em; }
  .md-preview h3{ font-size:1.15em; } .md-preview h4{ font-size:1.05em; }
  .md-preview p{ margin:.6em 0; }
  .md-preview ul,.md-preview ol{ margin:.5em 0; padding-left:1.5em; }
  .md-preview li{ margin:.2em 0; }
  .md-preview a{ color:var(--accent); text-decoration:underline; }
  .md-preview code{ background:var(--border); padding:.12em .4em; border-radius:5px; font-family:var(--mono); font-size:.9em; }
  .md-preview pre{ background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px 14px; overflow:auto; }
  .md-preview pre code{ background:transparent; padding:0; }
  .md-preview blockquote{ margin:.6em 0; padding:.4em 1em; border-left:3px solid var(--accent); color:var(--dim); background:var(--panel); border-radius:0 8px 8px 0; }
  .md-preview img{ max-width:100%; border-radius:8px; }
  .md-preview hr{ border:0; border-top:1px solid var(--border); margin:1em 0; }
  .md-preview table{ border-collapse:collapse; width:100%; }
</style>
</head>
<body>
<header class="tk-header">
  <a class="tk-back" href="./index.html">← 工具箱</a>
  <h1 class="tk-h1">📝 Markdown 预览</h1>
  <span class="tk-badge">纯前端 · 离线可用</span>
</header>
<main class="tk-main">
  <p class="tk-intro">左侧输入 Markdown，右侧实时渲染。解析器为原生 JS 手写实现，渲染前强制 HTML 转义，自动拦截 <code>&lt;script&gt;</code>、<code>javascript:</code> 等危险内容，可安心粘贴。</p>

  <section class="tk-card">
    <h2 class="tk-card-h"><span class="ico">✍️</span>编辑与预览</h2>
    <div class="md-wrap">
      <div class="md-side">
        <label class="tk-label" for="in">Markdown 源文</label>
        <textarea class="tk-textarea" id="in" spellcheck="false" placeholder="在此输入 # 标题、**粗体**、`代码` …"></textarea>
      </div>
      <div class="md-side">
        <label class="tk-label">实时预览</label>
        <div class="md-preview" id="preview"></div>
      </div>
    </div>
    <div class="tk-row" style="margin-top:12px">
      <button class="tk-btn" id="sample">载入示例</button>
      <button class="tk-btn ghost" id="clear">清空</button>
      <button class="tk-btn ghost" id="copyMd">复制原始 MD</button>
      <button class="tk-btn ghost" id="copyHtml">复制 HTML 源码</button>
    </div>
    <div class="tk-result" id="status" style="margin-top:12px">—</div>
  </section>

  <section class="tk-card">
    <h2 class="tk-card-h"><span class="ico">📤</span>渲染后 HTML 源码</h2>
    <div class="tk-out">
      <button class="tk-copy" id="copyHtml2">复制</button>
      <pre id="srcOut">（渲染后的 HTML 会显示在这里）</pre>
    </div>
    <p class="tk-help">HTML 源码同样会先转义再生成，复制出来也不含任何可执行脚本标签。</p>
  </section>
</main>
<div class="tk-toast" id="toast"></div>
<footer class="tk-foot">© 2026 FeSui · <a href="./index.html">返回工具箱</a></footer>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var toast = $("toast"), toastTimer;
  function showToast(m){ toast.textContent=m; toast.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){toast.classList.remove("show");},1600); }
  function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(function(){});} else {var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);} }

  /* ---------- XSS 安全：先转义，再套 MD 规则 ---------- */
  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  // 只允许 http/https/相对路径/锚点/mailto，其余协议（含 javascript:）拒绝
  function safeUrl(u){
    u = u.trim();
    if (/^https?:\/\//i.test(u)) return u;
    if (/^#/.test(u)) return u;
    if (/^mailto:/i.test(u)) return u;
    if (/^(\.\.?\/|\/)/.test(u)) return u;
    return "";
  }

  /* ---------- 行内解析 ---------- */
  function inline(s){
    s = escapeHtml(s);
    var codes = [];
    // 行内代码先抽取占位，避免内部被粗体/斜体误处理
    s = s.replace(/`([^`]+)`/g, function(m,c){ codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
    // 图片 ![alt](url)
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(m,alt,url){
      var u = safeUrl(url); return u ? ('<img src="'+u+'" alt="'+alt+'" />') : m;
    });
    // 链接 [text](url)
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m,txt,url){
      var u = safeUrl(url); return u ? ('<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+txt+'</a>') : m;
    });
    // 粗体
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    // 斜体
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    s = s.replace(/_([^_]+)_/g, "<em>$1</em>");
    // 还原行内代码
    s = s.replace(/\u0000(\d+)\u0000/g, function(m,idx){ return "<code>"+codes[+idx]+"</code>"; });
    s = s.replace(/\n/g, "<br>");
    return s;
  }

  /* ---------- 块级解析 ---------- */
  function md2html(src){
    src = src.replace(/\r\n?/g, "\n");
    var lines = src.split("\n");
    var out = [];
    var para = [];
    var listType = null;

    function flushPara(){
      if (para.length){ out.push("<p>"+inline(para.join("\n"))+"</p>"); para = []; }
    }
    function closeList(){ if (listType){ out.push("</"+listType+">"); listType = null; } }

    var i = 0;
    while (i < lines.length){
      var line = lines[i];

      // 围栏代码块
      var fence = line.match(/^```(.*)$/);
      if (fence){
        var lang = fence[1].trim();
        var buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])){ buf.push(lines[i]); i++; }
        i++; // 跳过结束围栏
        flushPara(); closeList();
        out.push("<pre><code"+(lang?(' class="lang-'+lang+'"'):"")+">"+escapeHtml(buf.join("\n"))+"</code></pre>");
        continue;
      }

      // 空行
      if (/^\s*$/.test(line)){ flushPara(); closeList(); i++; continue; }

      // 标题
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h){ flushPara(); closeList(); var lv=h[1].length; out.push("<h"+lv+">"+inline(h[2].trim())+"</h"+lv+">"); i++; continue; }

      // 分隔线
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ flushPara(); closeList(); out.push("<hr>"); i++; continue; }

      // 引用
      if (/^\s*>\s?/.test(line)){
        flushPara(); closeList();
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
        out.push("<blockquote>"+inline(q.join("\n"))+"</blockquote>");
        continue;
      }

      // 无序列表
      var ul = line.match(/^\s*[-*+]\s+(.*)$/);
      if (ul){ flushPara(); if (listType!=="ul"){ closeList(); out.push("<ul>"); listType="ul"; } out.push("<li>"+inline(ul[1].trim())+"</li>"); i++; continue; }

      // 有序列表
      var ol = line.match(/^\s*\d+\.\s+(.*)$/);
      if (ol){ flushPara(); if (listType!=="ol"){ closeList(); out.push("<ol>"); listType="ol"; } out.push("<li>"+inline(ol[1].trim())+"</li>"); i++; continue; }

      // 普通段落行
      para.push(line.trim());
      i++;
    }
    flushPara(); closeList();
    return out.join("\n");
  }

  /* ---------- 渲染 ---------- */
  var lastHtml = "";
  function render(){
    var v = $("in").value;
    if (!v.trim()){ $("preview").innerHTML = '<span class="tk-muted">（预览会显示在这里）</span>'; $("srcOut").textContent = "（渲染后的 HTML 会显示在这里）"; $("status").innerHTML = '<span class="tk-muted">等待输入…</span>'; lastHtml=""; return; }
    lastHtml = md2html(v);
    $("preview").innerHTML = lastHtml;
    $("srcOut").textContent = lastHtml;
    $("status").innerHTML = '<span class="tk-ok">✓ 已渲染</span>';
  }

  var SAMPLE = [
    "# 欢迎使用 Markdown 预览",
    "",
    "支持 **粗体**、*斜体*、`行内代码` 与 [链接](https://example.com)。",
    "",
    "## 列表",
    "- 苹果",
    "- 香蕉",
    "- 橙子",
    "",
    "1. 第一步",
    "2. 第二步",
    "",
    "> 这是一段引用文字，可以用来强调重点。",
    "",
    "```js",
    "function hi(){ console.log(\"hello\"); }",
    "```",
    "",
    "---",
    "",
    "![提示](https://via.placeholder.com/120)",
    "",
    "危险内容测试：<script>alert(1)<\/script> 与 [坏链接](javascript:alert(1)) 会被安全拦截。"
  ].join("\n");

  $("in").addEventListener("input", render);
  $("sample").addEventListener("click", function(){ $("in").value = SAMPLE; render(); showToast("已载入示例"); });
  $("clear").addEventListener("click", function(){ $("in").value=""; render(); });
  $("copyMd").addEventListener("click", function(){
    var t = $("in").value; if (!t.trim()){ showToast("没有可复制的内容"); return; }
    copyText(t); showToast("已复制原始 MD");
  });
  function copyHtml(){
    if (!lastHtml){ showToast("没有可复制的内容"); return; }
    copyText(lastHtml); showToast("已复制 HTML 源码");
  }
  $("copyHtml").addEventListener("click", copyHtml);
  $("copyHtml2").addEventListener("click", copyHtml);

  render();
})();
</script>
</body>
</html>
