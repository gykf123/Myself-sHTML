<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>附魔规划器 — Minecraft 搜索</title>
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  .layout { display: grid; gap: 18px; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr); align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }
  .picks { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; max-height: 320px; overflow: auto; }
  .pick { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; font-size: .83rem; background: var(--bg-elev); }
  .pick.on { border-color: var(--brand); background: var(--brand-soft); }
  .step-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: .88rem; }
  .step-n { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font-weight: 700; font-size: .78rem; flex: 0 0 26px; }
  .cost { margin-left: auto; font-family: var(--mono); font-weight: 700; }
</style>
</head>
<body>
<main class="wrap" style="padding-top:24px">
  <h1 id="h1"></h1>
  <p class="muted" id="lead" style="max-width:820px"></p>
  <div class="layout" style="margin-top:18px">
    <div>
      <div class="panel">
        <label class="fld" id="lblBase"></label>
        <input type="search" id="baseSearch" autocomplete="off">
        <div class="picks" id="basePicks"></div>
      </div>
      <div class="panel">
        <label class="fld" id="lblEnch"></label>
        <input type="search" id="enchSearch" autocomplete="off">
        <div class="picks" id="enchPicks"></div>
        <div id="chosen" style="margin-top:12px"></div>
      </div>
    </div>
    <div class="panel">
      <h2 id="planTitle"></h2>
      <div id="summary"></div>
      <div id="plan"></div>
      <h3 style="margin-top:18px" id="altTitle"></h3>
      <div id="alt"></div>
    </div>
  </div>
  <div class="prose" style="margin-top:30px"><h2 id="docTitle"></h2><div id="docBody"></div></div>
</main>
<script type="module">
import { boot, DB, t, lang, el, $, $$, toast, copyText, L, fmt } from '../assets/js/core.js';
boot({ active: 'tools' });
const zh = lang() === 'zh';

$('#h1').textContent = zh ? '附魔规划器' : 'Enchantment Planner';
$('#lead').textContent = zh
  ? '用铁砧把附魔书与装备合到一起时，顺序会显著影响经验花费。规划器会算出最省经验的合并顺序，并列出每一步的成本。'
  : 'When you combine books and gear on an anvil, the order changes the XP cost dramatically. The planner finds the cheapest merge order and breaks down every step.';
$('#lblBase').textContent = zh ? '要附魔的物品（基础装备）' : 'Base item to enchant';
$('#lblEnch').textContent = zh ? '目标附魔（点击添加，可调等级）' : 'Target enchantments (click to add, level adjustable)';
$('#planTitle').textContent = zh ? '最优方案' : 'Optimal plan';
$('#altTitle').textContent = zh ? '对比：逐个直接合并' : 'Comparison: naive pairwise merging';
$('#docTitle').textContent = zh ? '关于铁砧成本' : 'About anvil costs';
$('#docBody').innerHTML = zh
  ? '<p>铁砧合并的成本由两侧的「先验工作惩罚」（prior work penalty）与附魔本身的价值共同决定。每合并一次，结果的惩罚值约为两侧较大者 × 2 + 1。因此把附魔书两两合并成一棵平衡树，再与装备合并，通常比逐个贴到装备上便宜得多。</p><p>本计算器使用原版附魔权重与等级乘数（普通附魔等级 × 权重系数，宝藏附魔按 2 倍计），结果与游戏内花费一致（不含创造模式与铁砧损坏惩罚）。</p>'
  : '<p>Anvil cost depends on the prior-work penalty of both sides plus the enchantment values themselves. Each merge roughly doubles the larger penalty and adds one. Merging books into a balanced tree before applying them to the gear is therefore usually far cheaper than applying them one by one.</p><p>This calculator uses vanilla enchantment weights and level multipliers (treasure enchantments count double), matching in-game costs (creative mode and anvil-break penalties excluded).</p>';

let DATA = null, itemsByCat = [];
await (async () => { const { items, enchantments } = await DB.all(); DATA = { items, enchantments }; })();

const ENCH_TARGET_CATS = { mining: 'pickaxe', mining_loot: 'pickaxe', digger: 'shovel', farming: 'hoe', fishing: 'fishing_rod', trident: 'trident', weapon: 'sword', bow: 'bow', crossbow: 'crossbow', armor_head: 'helmet', armor_chest: 'chestplate', armor_legs: 'leggings', armor_feet: 'boots', breakable: 'tool' };

let base = null;
const chosen = new Map();   // enchant name → level

function renderBase(q = '') {
  const qq = q.trim().toLowerCase();
  const withEnch = DATA.items.filter(i => (i.ench || []).length || /_sword$|_pickaxe$|_axe$|_shovel$|_hoe$|_helmet$|_chestplate$|_leggings$|_boots$|^bow$|^crossbow$|^trident$|^fishing_rod$|^elytra$|^shield$|^mace$/.test(i.name));
  const list = withEnch.filter(i => !qq || (i.en || '').toLowerCase().includes(qq) || (i.zh || '').includes(q) || i.name.includes(qq)).slice(0, 40);
  $('#basePicks').replaceChildren(...list.map(i => {
    const c = el('div', { class: 'pick' + (base && base.id === i.id ? ' on' : '') }, L(i.en, i.name));
    c.onclick = () => {
      base = i; chosen.clear(); renderBase(q); renderEnchPicks(); plan();
    };
    return c;
  }));
  if (!list.length) $('#basePicks').append(el('div', { class: 'empty', style: 'width:100%' }, t('common.noResults')));
}
function applicableEnch() {
  if (!base) return DATA.enchantments;
  const cats = new Set(base.ench || []);
  return DATA.enchantments.filter(e => !cats.size || cats.has(e.category) || e.curse || e.treasure && cats.size === 0);
}
function renderEnchPicks(q = '') {
  const qq = q.trim().toLowerCase();
  const list = applicableEnch().filter(e => !qq || (e.en || '').toLowerCase().includes(qq) || (e.zh || '').includes(q) || e.name.includes(qq)).slice(0, 60);
  $('#enchPicks').replaceChildren(...list.map(e => {
    const on = chosen.has(e.name);
    const c = el('div', { class: 'pick' + (on ? ' on' : '') }, `${L(e.en, e.name)} `, el('span', { class: 'faint' }, '§' + e.maxLevel));
    c.onclick = () => { on ? chosen.delete(e.name) : chosen.set(e.name, e.maxLevel); renderEnchPicks(); renderChosen(); plan(); };
    return c;
  }));
  if (!list.length) $('#enchPicks').append(el('div', { class: 'empty', style: 'width:100%' }, t('common.noResults')));
}
function renderChosen() {
  $('#chosen').replaceChildren(...[...chosen].map(([n, lv]) => {
    const e = DATA.enchantments.find(x => x.name === n);
    const w = el('div', { class: 'pick on' }, `${L(e.en, e.name)} `);
    const inp = el('input', { type: 'number', value: String(lv), min: '1', max: String(e.maxLevel), style: 'width:50px;padding:2px 4px' });
    inp.onchange = () => { chosen.set(n, Math.max(1, Math.min(e.maxLevel, Number(inp.value) || 1))); plan(); };
    const del = el('button', { class: 'btn sm', style: 'padding:1px 6px', onclick: () => { chosen.delete(n); renderEnchPicks(); renderChosen(); plan(); } }, '✕');
    w.append(inp, del);
    return w;
  }));
  if (!chosen.size) $('#chosen').append(el('div', { class: 'faint', style: 'font-size:.83rem' }, zh ? '尚未选择附魔' : 'No enchantments selected'));
}
renderBase();
$('#baseSearch').oninput = e => renderBase(e.target.value);
renderEnchPicks(); renderChosen();
$('#enchSearch').oninput = e => renderEnchPicks(e.target.value);

/* ------------------------------ 成本模型 ------------------------------ */
/* 附魔价值 ≈ 等级 × 权重系数（宝藏附魔 ×2），向下取整，最低 1 */
function enchValue(e, lv) {
  const base = lv * e.weight;
  return Math.max(1, Math.floor(base * (e.treasure ? 2 : 1)));
}
/* 合并两件物品：返回 {value, penalty}，penalty = 先验工作惩罚 */
function merge(a, b) {
  const value = a.value + b.value;
  const penalty = Math.max(a.penalty, b.penalty) * 2 + 1;
  return { value, penalty, level: Math.max(a.level || 1, b.level || 1) };
}
function costOf(a, b) {
  const m = merge(a, b);
  return { cost: Math.max(1, m.value + m.penalty), result: m };
}

/* 平衡树合并：把每本书视为叶子，两两配对，最贵的一对最后合（贪心） */
function optimalPlan(books, baseItem) {
  let pool = books.map(b => ({ ...b, label: b.label }));
  const steps = [];
  while (pool.length > 1) {
    // 选择价值最低的两项先合并（小的先合，惩罚增长慢）
    pool.sort((a, b) => a.value - b.value);
    const a = pool.shift(), b = pool.shift();
    const { cost, result } = costOf(a, b);
    steps.push({ a, b, cost, result });
    pool.push({ ...result, label: `${a.label} + ${b.label}` });
  }
  let total = steps.reduce((s, x) => s + x.cost, 0);
  if (pool.length === 1) {
    const { cost, result } = costOf(pool[0], baseItem);
    steps.push({ a: pool[0], b: { ...baseItem, label: baseItem.label }, cost, result, final: true });
    total += cost;
  }
  return { steps, total, result: pool[0] };
}
function naivePlan(books, baseItem) {
  let acc = { ...baseItem };
  const steps = []; let total = 0;
  for (const b of books) {
    const { cost, result } = costOf(acc, b);
    steps.push({ a: { ...acc }, b, cost, result });
    total += cost; acc = { ...result, label: baseItem.label };
  }
  return { steps, total };
}

function plan() {
  if (!base || !chosen.size) {
    $('#summary').innerHTML = `<div class="empty">${zh ? '选择装备与附魔后显示方案' : 'Pick gear and enchantments to see the plan'}</div>`;
    $('#plan').innerHTML = ''; $('#alt').innerHTML = ''; return;
  }
  const books = [...chosen].map(([n, lv]) => {
    const e = DATA.enchantments.find(x => x.name === n);
    return { label: `${L(e.en, e.name)} ${lv}`, value: enchValue(e, lv), penalty: 0, lv, e };
  });
  const baseItem = { label: L(base.en, base.name), value: 0, penalty: 0, level: 1 };

  const opt = optimalPlan(books.map(b => ({ ...b })), baseItem);
  const nav = naivePlan(books, baseItem);
  const levels = Math.ceil(opt.total / 1);   // 成本单位 ≈ 经验等级需求

  $('#summary').innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="k">${zh ? '附魔数' : 'Enchants'}</div><div class="v">${books.length}</div></div>
      <div class="stat"><div class="k">${zh ? '最优总成本' : 'Optimal cost'}</div><div class="v">${fmt(opt.total)}</div></div>
      <div class="stat"><div class="k">${zh ? '逐个合并' : 'Naive merging'}</div><div class="v">${fmt(nav.total)}</div></div>
      <div class="stat"><div class="k">${zh ? '节省' : 'Saved'}</div><div class="v">${nav.total > 0 ? Math.round((1 - opt.total / nav.total) * 100) : 0}%</div></div>
    </div>
    <p class="faint" style="font-size:.82rem;margin-top:10px">${zh
      ? '成本单位与游戏内铁砧提示的经验等级需求一致（越高越贵）。'
      : 'Cost units match the XP level requirement shown on the in-game anvil.'}</p>`;

  const stepHTML = (s, i) => `<div class="step-row">
      <span class="step-n">${i + 1}</span>
      <span><b>${esc(s.a.label)}</b> ＋ <b>${esc(s.b.label)}</b>${s.final ? ` <span class="badge b">${zh ? '贴上装备' : 'apply to gear'}</span>` : ''}</span>
      <span class="cost">${fmt(s.cost)}</span></div>`;
  $('#plan').innerHTML = opt.steps.map(stepHTML).join('') +
    `<div class="step-row" style="border:0;padding-top:12px"><b>${zh ? '合计' : 'Total'}</b><span class="cost">${fmt(opt.total)}</span></div>`;
  $('#alt').innerHTML = nav.steps.map(stepHTML).join('') +
    `<div class="step-row" style="border:0;padding-top:12px"><b>${zh ? '合计' : 'Total'}</b><span class="cost">${fmt(nav.total)}</span></div>`;
}
function esc(s) { return String(s ?? '').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c])); }

base = DATA.items.find(i => i.name === 'diamond_pickaxe') || DATA.items[0];
renderBase(); renderEnchPicks();
// 默认示例
['efficiency', 'unbreaking', 'fortune', 'mending'].forEach(n => {
  const e = DATA.enchantments.find(x => x.name === n); if (e) chosen.set(n, e.maxLevel);
});
renderEnchPicks(); renderChosen(); plan();
</script>
</body>
</html>
