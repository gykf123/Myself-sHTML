<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cron 解析 · FeSui 工具箱</title>
<meta name="referrer" content="no-referrer">
<meta name="description" content="标准 5 段 Cron 表达式解析：中文描述 + 最近 N 次执行时间，纯前端离线可用">
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="./toolkit.css?v=20261030">
</head>
<body>
<header class="tk-header">
  <a class="tk-back" href="./index.html">← 工具箱</a>
  <h1 class="tk-h1">⏰ Cron 解析</h1>
  <span class="tk-badge">纯前端 · 离线可用</span>
</header>
<main class="tk-main">
  <p class="tk-intro">输入标准 5 段 Cron（分 时 日 月 周，空格分隔），如 <code>0 */6 * * *</code>。自动生成中文描述并推算未来执行时间。</p>

  <section class="tk-card">
    <h2 class="tk-card-h"><span class="ico">📝</span>表达式</h2>
    <div class="tk-row">
      <div class="tk-col">
        <label class="tk-label" for="expr">Cron 表达式</label>
        <input class="tk-input" id="expr" type="text" placeholder="0 */6 * * *" value="0 */6 * * *" spellcheck="false" />
      </div>
      <div class="tk-col" style="flex:0 0 130px">
        <label class="tk-label" for="count">显示次数</label>
        <input class="tk-num" id="count" type="number" min="1" max="200" value="10" />
      </div>
    </div>
    <div class="tk-row" style="margin-top:12px">
      <button class="tk-btn primary" id="run">解析</button>
      <button class="tk-btn ghost" id="example">填入示例</button>
    </div>
    <div class="tk-result" id="status" style="margin-top:12px">—</div>
  </section>

  <section class="tk-card">
    <h2 class="tk-card-h"><span class="ico">🗣</span>人类语言描述</h2>
    <div class="tk-result" id="desc" aria-live="polite">—</div>
  </section>

  <section class="tk-card">
    <h2 class="tk-card-h"><span class="ico">📅</span>最近执行时间</h2>
    <div class="tk-out">
      <button class="tk-copy" id="copy">复制</button>
      <pre id="out">（解析后显示）</pre>
    </div>
    <p class="tk-help">从当前时间起逐分钟推算，最多迭代 1,000,000 次（约 2 年），超范围会提示「范围过大」。</p>
  </section>
</main>
<div class="tk-toast" id="toast"></div>
<footer class="tk-foot">© 2026 FeSui · <a href="./index.html">返回工具箱</a></footer>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var toast = $("toast"), toastTimer;
  function showToast(m){ toast.textContent=m; toast.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){toast.classList.remove("show");},1600); }
  function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(function(){});} else {var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);} }

  var FIELDS = [
    { name:"分", min:0, max:59 },
    { name:"时", min:0, max:23 },
    { name:"日", min:1, max:31 },
    { name:"月", min:1, max:12 },
    { name:"周", min:0, max:7 }   // 0 和 7 均表示周日
  ];
  var WEEK = ["日","一","二","三","四","五","六"];

  // 把单个字段解析成 { all:bool, step:int|null, values:Set }
  function parseField(raw, fdef){
    raw = raw.trim();
    if (raw === "") raw = "*";
    var values = new Set();
    var all = false;
    var step = null;
    var parts = raw.split(",");
    for (var i=0;i<parts.length;i++){
      var p = parts[i].trim();
      if (p === "") throw new Error("字段为空段");
      var slash = p.split("/");
      var rangePart = slash[0];
      var stepStr = slash.length>1 ? slash[1] : null;
      var lo, hi;
      if (rangePart === "*"){
        lo = fdef.min; hi = fdef.max;
      } else if (rangePart.indexOf("-") > -1){
        var rr = rangePart.split("-");
        lo = parseInt(rr[0],10); hi = parseInt(rr[1],10);
        if (isNaN(lo)||isNaN(hi)) throw new Error("范围非法");
      } else {
        lo = parseInt(rangePart,10); hi = lo;
        if (isNaN(lo)) throw new Error("数字非法");
      }
      if (stepStr !== null){
        step = parseInt(stepStr,10);
        if (isNaN(step) || step < 1) throw new Error("步长非法");
      }
      // 校验范围（周字段 7 视为 0）
      var vmax = fdef.max;
      if (lo < fdef.min || hi > vmax) throw new Error("取值超出 "+fdef.min+"-"+vmax);
      if (lo > hi) throw new Error("范围左大右小");
      var s = step || 1;
      for (var v=lo; v<=hi; v+=s){
        var val = v;
        if (fdef.name === "周" && val === 7) val = 0; // 归一化到 0-6
        values.add(val);
      }
    }
    if (values.size === (fdef.max - fdef.min + 1) && !step) all = true;
    // 周字段：含全部 0-6 也视为 all（注意 7 已归一）
    if (fdef.name === "周"){
      var full = true;
      for (var k=fdef.min;k<=6;k++){ if(!values.has(k)){ full=false; break; } }
      if (full) all = true;
    }
    return { all:all, step:step, values:values, raw:raw };
  }

  function pad(n){ return (n<10?"0":"")+n; }

  // 字段的中文短语（unitWord 用于普通字段）
  function fieldPhrase(field, unitWord, weekWord){
    if (field.all) return null;
    if (field.step){
      var sw = weekWord || unitWord;
      return "每 "+field.step+" "+sw;
    }
    var vals = Array.from(field.values).sort(function(a,b){return a-b;});
    if (vals.length === 1){
      return (weekWord ? weekWord(vals[0]) : vals[0]+unitWord);
    }
    // 连续范围？
    var contig = true;
    for (var i=1;i<vals.length;i++){ if (vals[i] !== vals[i-1]+1){ contig=false; break; } }
    if (contig){
      var a = weekWord ? weekWord(vals[0]) : vals[0]+unitWord;
      var b = weekWord ? weekWord(vals[vals.length-1]) : vals[vals.length-1]+unitWord;
      return a+" 到 "+b;
    }
    return vals.map(function(x){ return weekWord ? weekWord(x) : x+unitWord; }).join("、");
  }

  function describe(fields){
    var min = fields[0], hour = fields[1], day = fields[2], month = fields[3], week = fields[4];
    var pieces = [];

    // 月份
    var mp = fieldPhrase(month, "月");
    if (mp) pieces.push("每年 "+mp);

    // 日 / 周（OR 语义）
    var dayAll = day.all, weekAll = week.all;
    var weekWord = function(x){ return "周"+WEEK[x]; };
    if (dayAll && weekAll){
      pieces.push("每天");
    } else if (dayAll && !weekAll){
      var wp = fieldPhrase(week, "", weekWord);
      pieces.push("每"+(wp || "周"));
    } else if (!dayAll && weekAll){
      var dp = fieldPhrase(day, "日");
      pieces.push("每月 "+(dp || "每日"));
    } else {
      var dp2 = fieldPhrase(day, "日");
      var wp2 = fieldPhrase(week, "", weekWord);
      pieces.push("每月 "+(dp2||"每日")+" 或 每"+(wp2||"周"));
    }

    // 时间（分 + 时）
    var timeStr;
    if (min.all && hour.all){
      timeStr = "任意时刻";
    } else {
      var combos = [];
      var hs = Array.from(hour.values).sort(function(a,b){return a-b;});
      var ms = Array.from(min.values).sort(function(a,b){return a-b;});
      for (var i=0;i<hs.length;i++){
        for (var j=0;j<ms.length;j++){ combos.push(pad(hs[i])+":"+pad(ms[j])); }
      }
      if (combos.length > 0 && combos.length <= 24){
        timeStr = "在 "+combos.join("、");
      } else {
        // 兜底：用短语描述
        var hp = fieldPhrase(hour, "时");
        var mp2 = fieldPhrase(min, "分");
        var segs = [];
        if (mp2 && mp2.indexOf("每")===0) segs.push(mp2);
        else if (mp2) segs.push("每小时的 "+mp2);
        if (hp && hp.indexOf("每")===0) segs.push(hp);
        else if (hp) segs.push("每天 "+hp);
        timeStr = segs.length ? segs.join("，") : "特定时刻";
      }
    }
    pieces.push(timeStr);

    return pieces.join("，");
  }

  function nextRuns(fields, n, startMs){
    var MAX_ITER = 1000000;
    var MAX_MS = startMs + 4*366*24*60*60*1000; // 约 4 年
    var min=fields[0], hour= fields[1], day=fields[2], month=fields[3], week=fields[4];
    var results = [];
    var d = new Date(startMs);
    d.setSeconds(0,0); // 从整分开始
    var iter = 0;
    while (results.length < n && iter < MAX_ITER){
      iter++;
      var mm = d.getMinutes(), hh = d.getHours(), dd = d.getDate(), mo = d.getMonth()+1, wd = d.getDay();
      var minOk = min.all || min.values.has(mm);
      var hourOk = hour.all || hour.values.has(hh);
      var monthOk = month.all || month.values.has(mo);
      var dayOk;
      if (day.all && week.all) dayOk = true;
      else if (day.all) dayOk = week.values.has(wd);
      else if (week.all) dayOk = day.values.has(dd);
      else dayOk = day.values.has(dd) || week.values.has(wd);
      if (minOk && hourOk && monthOk && dayOk){
        results.push(d.getFullYear()+"-"+pad(mo)+"-"+pad(dd)+" "+pad(hh)+":"+pad(mm)+" 周"+WEEK[wd]);
        d.setMinutes(d.getMinutes()+1);
      } else {
        d.setMinutes(d.getMinutes()+1);
      }
      if (d.getTime() > MAX_MS){ break; }
    }
    return { list:results, hit:iter>=MAX_ITER, over: d.getTime()>MAX_MS && results.length<n };
  }

  function run(){
    var expr = $("expr").value.trim();
    if (!expr){ setStatus(false,"请输入 Cron 表达式"); return; }
    var segs = expr.split(/\s+/);
    if (segs.length !== 5){ setStatus(false,"应为 5 段（分 时 日 月 周），当前 "+segs.length+" 段"); return; }
    var fields = [];
    for (var i=0;i<5;i++){
      try {
        fields.push(parseField(segs[i], FIELDS[i]));
      } catch(e){
        setStatus(false, "第 "+(i+1)+" 段（"+FIELDS[i].name+"）错误：" + e.message + "，合法范围 "+FIELDS[i].min+"-"+FIELDS[i].max);
        return;
      }
    }
    var n = parseInt($("count").value,10);
    if (isNaN(n) || n<1) n = 10; if (n>200) n = 200;

    $("desc").innerHTML = '<span class="tk-ok">'+describe(fields)+'</span>';
    setStatus(true, "解析成功");

    var res = nextRuns(fields, n, Date.now());
    if (res.list.length === 0){
      $("out").textContent = "（未来 4 年内未找到匹配时间）";
    } else {
      $("out").textContent = res.list.join("\n");
    }
    if (res.hit || res.over){
      setStatus(false, "范围过大：迭代已达上限或超出 4 年，仅列出可确定的部分");
    }
  }

  function setStatus(ok, msg){ $("status").innerHTML = ok ? '<span class="tk-ok">✓ '+msg+'</span>' : '<span class="tk-err">✗ '+msg+'</span>'; }

  $("run").addEventListener("click", run);
  $("expr").addEventListener("keydown", function(e){ if(e.key==="Enter") run(); });
  $("count").addEventListener("change", run);
  $("example").addEventListener("click", function(){
    var ex = ["0 */6 * * *","30 9 * * 1-5","0 0 1 1 *","*/15 * * * *","0 18 * * 6,0"];
    var cur = ex[Math.floor(Math.random()*ex.length)];
    $("expr").value = cur; run();
  });
  $("copy").addEventListener("click", function(){
    var t = $("out").textContent;
    if (!t || t.indexOf("（")===0){ showToast("暂无可复制内容"); return; }
    copyText(t); showToast("已复制执行时间");
  });

  run();
})();
</script>
</body>
</html>
