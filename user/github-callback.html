<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub 授权 · FeSui</title>
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="../favicon.png" />
  <link rel="stylesheet" href="../style.css?v=20261107b" />
  <link rel="stylesheet" href="./user.css?v=20261108" />
  <script src="/net-guard.js?v=20261107"></script>
  <script src="/site-nav.js?v=20261114b"></script>
</head>
<body>
  <div class="user-page">
    <header class="user-topbar">
      <a class="user-brand" href="../">
        <span class="user-logo" aria-hidden="true">F</span>
        <span class="user-brand-name">FeSui</span>
      </a>
      <nav class="user-topnav" aria-label="页面导航">
        <a href="../">主页</a>
        <a href="./">个人中心</a>
      </nav>
    </header>

    <main class="user-main">
      <section class="user-card guide-card" id="resultCard">
        <div class="guide-ico" aria-hidden="true">🔗</div>
        <h1 id="resultTitle">正在处理 GitHub 授权…</h1>
        <p id="resultText">授权码交换中，请稍候。</p>
        <div class="guide-actions" id="resultActions" hidden>
          <a class="act-btn primary" href="./">返回个人中心</a>
          <a class="act-btn" href="../">返回主页</a>
        </div>
      </section>
    </main>
  </div>

  <script>
    /* GitHub OAuth 统一回调落地页。
       两个发起方共用这一个 redirect_uri（OAuth App 只需登记一次）：
         · user/user.js     → state 前缀 link: / 无前缀（旧页面兼容）→ 关联到当前登录账号
         · login/index.html → state 前缀 login:                      → 免登录态一键登录
       登录模式只拿一次性 ticket 回跳，真正的 JWT 由目标页经 POST 兑换，
       不出现在 URL、页面 JS 或浏览器历史里。 */
    (async function () {
      // 主题跟随主站
      try { document.documentElement.classList.toggle('theme-glass', (localStorage.getItem('theme') || 'glass') === 'glass'); } catch (e) {}

      const SUPABASE_URL = 'https://yowwyasttkywyqgseuqz.supabase.co';
      const ANON_KEY = 'sb_publishable_j4rpi2ejPTMGxo79uaaX3g_kQYrinS4';
      const title = document.getElementById('resultTitle');
      const text = document.getElementById('resultText');
      const ico = document.querySelector('.guide-ico');
      const actions = document.getElementById('resultActions');

      function fail(msg, heading) {
        ico.textContent = '😵';
        title.textContent = heading || '操作失败';
        text.textContent = msg;
        actions.hidden = false;
      }
      function linkedOk(login) {
        ico.textContent = '🎉';
        title.textContent = '关联成功';
        text.textContent = login ? ('已绑定 GitHub 账号 @' + login + '，正在返回个人中心…')
                                 : '已绑定 GitHub 账号，正在返回个人中心…';
        setTimeout(() => { location.href = './?linked=github'; }, 1600);
      }
      // 与 login 页同款白名单：同父域子域（如 fkd / fesui 同属一个主域）允许回跳
      function parentDomain(host) { return host.split('.').slice(-2).join('.'); }

      const qs = new URLSearchParams(location.search);
      // GitHub 侧错误（用户拒绝授权等）：?error=access_denied
      if (qs.get('error')) {
        fail(qs.get('error') === 'access_denied' ? '你取消了 GitHub 授权，可以重新再试。'
                                                 : 'GitHub 返回错误：' + qs.get('error'), '授权未完成');
        return;
      }
      const code = qs.get('code');
      const state = qs.get('state');
      const savedState = sessionStorage.getItem('gh_oauth_state');
      if (!code || !state) { fail('回调参数不完整（缺少 code / state）。'); return; }
      if (!savedState || savedState !== state) {
        fail('安全校验未通过（state 不匹配）。这通常是跨站请求伪造防护生效，请重新发起操作。');
        return;
      }
      // 无论成败都消费掉 state，防止刷新重放同一个授权码
      try { sessionStorage.removeItem('gh_oauth_state'); } catch (e) {}

      const isLogin = state.indexOf('login:') === 0;

      /* ---------- 关联模式：把 GitHub 绑到当前已登录账号 ---------- */
      if (!isLogin) {
        let token = '';
        try { token = localStorage.getItem('fe_token') || ''; } catch (e) {}
        if (!token) { fail('本地登录态缺失，请先登录再关联。'); return; }
        try {
          const r = await fetch(SUPABASE_URL + '/functions/v1/account', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ action: 'callback', code: code })
          });
          const data = await r.json().catch(() => null);
          if (r.ok && data && data.success) linkedOk(data.github && data.github.login);
          else fail((data && data.error) || ('服务端返回 ' + r.status), '关联失败');
        } catch (e) { fail('网络请求失败，请稍后重试。', '关联失败'); }
        return;
      }

      /* ---------- 登录模式：换一次性 ticket 并回跳 ---------- */
      title.textContent = '正在通过 GitHub 登录…';
      text.textContent = '正在核验 GitHub 身份并生成登录凭证。';
      let dest;
      try {
        const raw = sessionStorage.getItem('gh_login_redirect') || (location.origin + '/');
        const u = new URL(raw, location.origin);
        const allowed = u.host === location.host || parentDomain(u.host) === parentDomain(location.host);
        dest = allowed ? u : new URL(location.origin + '/');
        sessionStorage.removeItem('gh_login_redirect');
      } catch (e) { dest = new URL(location.origin + '/'); }

      try {
        const r = await fetch(SUPABASE_URL + '/functions/v1/account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
          body: JSON.stringify({ action: 'github_login', code: code })
        });
        const data = await r.json().catch(() => null);
        if (r.ok && data && data.success && data.ticket) {
          ico.textContent = '🎉';
          title.textContent = '登录成功';
          text.textContent = '正在以 ' + (data.nickname || data.username || '已关联账号') + ' 的身份返回…';
          dest.searchParams.set('ticket', data.ticket);
          setTimeout(() => { location.href = dest.toString(); }, 900);
          return;
        }
        if (data && data.code === 'NOT_LINKED') {
          fail(data.error, '这个 GitHub 还没关联站点账号');
          const a = document.createElement('a');
          a.className = 'act-btn primary';
          a.href = '../login/?gh_error=' + encodeURIComponent(data.error);
          a.textContent = '去登录 / 关联';
          actions.insertBefore(a, actions.firstChild);
          return;
        }
        fail((data && data.error) || ('服务端返回 ' + r.status), '登录失败');
      } catch (e) { fail('网络请求失败，请稍后重试。', '登录失败'); }
    })();
  </script>
  <script src="/visit.js?v=20261107" defer></script>
</body>
</html>
