<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">登录 / 注册</title>
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="账号登录与注册入口" />
  <link rel="icon" href="../favicon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #e8eaed;
      background:
        radial-gradient(700px 480px at 18% 20%, #5b8cff55, transparent 60%),
        radial-gradient(620px 420px at 84% 26%, #b15bff48, transparent 60%),
        radial-gradient(680px 500px at 50% 88%, #4fffe044, transparent 60%),
        linear-gradient(135deg, #0b0f2a, #161a3a);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
      padding: 34px 30px 26px;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #5b8cff, #b15bff);
      display: grid; place-items: center;
      font-weight: 800; font-size: 20px; color: #fff;
      box-shadow: 0 6px 18px rgba(91, 140, 255, 0.4);
    }
    .brand h1 { font-size: 22px; letter-spacing: 1px; }
    .sub { color: #9aa0aa; font-size: 13px; margin: 2px 0 20px; }

    .tabs { display: flex; gap: 6px; background: rgba(255,255,255,.06); padding: 5px; border-radius: 12px; margin-bottom: 20px; }
    .tabs button {
      flex: 1; border: 0; background: transparent; color: #9aa0aa;
      padding: 9px 0; border-radius: 9px; cursor: pointer; font-size: 14px; transition: .2s;
    }
    .tabs button.active { background: linear-gradient(135deg, #5b8cff, #b15bff); color: #fff; font-weight: 600; }

    form { display: flex; flex-direction: column; gap: 13px; }
    form[hidden] { display: none; }
    label { font-size: 12px; color: #9aa0aa; margin-bottom: -6px; }
    input, textarea {
      width: 100%; padding: 12px 14px; border-radius: 11px; font-size: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e8eaed; outline: none; transition: border .2s, background .2s;
    }
    input:focus, textarea:focus { border-color: #6f9bff; background: rgba(255,255,255,.1); }
    textarea { resize: vertical; min-height: 64px; }
    input::placeholder, textarea::placeholder { color: #6b7280; }

    .btn {
      margin-top: 6px; padding: 13px; border: 0; border-radius: 12px; cursor: pointer;
      font-size: 15px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, #5b8cff, #b15bff);
      box-shadow: 0 8px 22px rgba(91, 140, 255, 0.35); transition: transform .15s, opacity .2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .msg { font-size: 13px; min-height: 18px; margin-top: 4px; }
    .msg.error { color: #ff8a8a; }
    .msg.success { color: #7ff0a8; }

    .hint { font-size: 12px; color: #8a909c; margin-top: 14px; line-height: 1.6; text-align: center; }
    .back { display: block; text-align: center; margin-top: 14px; font-size: 13px; color: #6f9bff; text-decoration: none; }
    .back:hover { text-decoration: underline; }

    .oauth-sep { display: flex; align-items: center; gap: 12px; margin: 6px 0 2px; font-size: 12px; color: #7c8393; }
    .oauth-sep::before, .oauth-sep::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.14); }
    .gh-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 11px 13px; border-radius: 12px; cursor: pointer;
      font-size: 14px; font-weight: 600; color: #e8eaed;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18);
      transition: background .2s, transform .15s;
    }
    .gh-btn:hover { background: rgba(255,255,255,.13); transform: translateY(-1px); }
    .gh-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .gh-btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
    .gh-note { font-size: 11px; color: #727a89; line-height: 1.6; text-align: center; margin-top: 2px; }
  </style>
  <script src="/net-guard.js?v=20261107"></script>
  <script src="/site-nav.js?v=20261114"></script>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo" id="logoEl">U</div>
      <h1 id="brandEl">账户</h1>
    </div>
    <p class="sub" id="subEl">登录或注册账号</p>

    <div class="tabs">
      <button data-tab="login" class="active">登录</button>
      <button data-tab="apply">注册</button>
    </div>

    <form id="loginForm" autocomplete="on">
      <label for="loginUsername">用户名</label>
      <input id="loginUsername" type="text" placeholder="登录名" required />
      <label for="loginPassword">密码</label>
      <input id="loginPassword" type="password" placeholder="密码" required />
      <button class="btn" type="submit" id="loginBtn">登录</button>
      <div class="msg" id="loginMsg"></div>
      <div class="oauth-sep"><span>或</span></div>
      <button class="gh-btn" type="button" id="ghLoginBtn">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>通过 GitHub 登录</span>
      </button>
      <div class="msg" id="ghMsg"></div>
      <p class="gh-note">需先在个人中心「关联 GitHub」，关联后即可一键登录。</p>
    </form>

    <form id="applyForm" hidden autocomplete="on">
      <label for="applyUsername">用户名（3-20 位，中英文/数字/下划线）</label>
      <input id="applyUsername" type="text" placeholder="登录名" required />
      <label for="applyPassword">密码（至少 6 位）</label>
      <input id="applyPassword" type="password" placeholder="密码" required />
      <label for="applyContact">联系方式（选填）</label>
      <input id="applyContact" type="text" placeholder="QQ / 邮箱 / 微信" />
      <label for="applyReason">简介（选填）</label>
      <textarea id="applyReason" placeholder="一句话介绍自己"></textarea>
      <button class="btn" type="submit" id="applyBtn">注册</button>
      <div class="msg" id="applyMsg"></div>
    </form>

    <p class="hint">注册成功后即可直接登录，无需审核。</p>
    <a class="back" id="backLink" href="../">← 返回主页</a>
  </main>

  <script>
    // 与主站共用同一 Supabase 项目（公开的前端 publishable key，可内联）
    const SUPABASE_URL = 'https://yowwyasttkywyqgseuqz.supabase.co';
    const ANON_KEY = 'sb_publishable_j4rpi2ejPTMGxo79uaaX3g_kQYrinS4';
    const FUNCTIONS_BASE = SUPABASE_URL + '/functions/v1';

    // —— 通用配置：由调用方通过 URL 参数传入，本页不写死任何站点 / 品牌 ——
    //   brand    : 品牌名（标题与 Logo 文字）
    //   home     : 主站首页（默认回跳目标 + “返回主页”链接 + 同源白名单基准）
    //   redirect : 登录后具体回跳地址（可选，缺省回 home）
    const qs = new URLSearchParams(location.search);
    const BRAND = (qs.get('brand') || '账户').trim();
    const HOME = (qs.get('home') || location.origin + '/').trim();

    // 同源判定：允许回跳到 home 同父域下的任意子域（如 fkd / fesui 同属一个主域）
    // 注：父域取 host 最后两段，覆盖 .gay 等单段顶级域场景
    function parentDomain(host) {
      return host.split('.').slice(-2).join('.');
    }
    function isAllowedHost(host) {
      try {
        const base = new URL(HOME).host;
        return host === base || parentDomain(host) === parentDomain(base);
      } catch (e) { return false; }
    }
    // 仅允许回跳到 home 同源地址，避免开放重定向
    function getRedirect() {
      const raw = qs.get('redirect');
      if (!raw) return HOME;
      try {
        const u = new URL(raw, location.origin);
        if ((u.protocol === 'https:' || u.protocol === 'http:') && isAllowedHost(u.host)) {
          return u.toString();
        }
      } catch (e) {}
      return HOME;
    }

    // 按品牌参数渲染标题、品牌区与返回链接
    document.getElementById('pageTitle').textContent = BRAND + ' · 登录 / 注册';
    document.getElementById('brandEl').textContent = BRAND;
    document.getElementById('logoEl').textContent = BRAND.slice(0, 1).toUpperCase();
    document.getElementById('backLink').href = HOME;

    async function callFn(path, body) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);
      try {
        const r = await fetch(FUNCTIONS_BASE + '/' + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
          body: JSON.stringify(body),
          signal: ctrl.signal
        });
        clearTimeout(timer);
        let data = {};
        try { data = await r.json(); } catch (e) {}
        return { ok: r.ok, status: r.status, data };
      } catch (e) {
        clearTimeout(timer);
        return { ok: false, status: 0, data: { error: '网络请求失败，请检查网络后重试' } };
      }
    }

    function setMsg(el, text, ok) {
      el.textContent = text || '';
      el.className = 'msg ' + (ok ? 'success' : 'error');
    }

    // Tab 切换
    document.querySelectorAll('.tabs button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        const tab = b.dataset.tab;
        document.getElementById('loginForm').hidden = tab !== 'login';
        document.getElementById('applyForm').hidden = tab !== 'apply';
        setMsg(document.getElementById('loginMsg'), '', true);
        setMsg(document.getElementById('applyMsg'), '', true);
      });
    });

    // 登录：成功后先换一张一次性票(ticket)，再跳回主站。
    // 旧做法把 JWT 直接写在 URL 上（会被 CDN/代理访问日志、浏览器历史、外链 Referer 记录），
    // 现在 URL 上只有 2 分钟有效、兑换一次即作废的票，真正的 JWT 走 POST 响应体（no-store）。
    // 换票接口万一异常，自动回退到旧的 ?token= 方式，保证登录链路不被卡住。
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('loginMsg');
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!username || !password) { setMsg(msg, '请输入用户名和密码', false); return; }
      btn.disabled = true; btn.textContent = '登录中...';
      setMsg(msg, '', true);
      const { ok, data } = await callFn('login', { username, password });
      if (!ok) { btn.disabled = false; btn.textContent = '登录'; setMsg(msg, data.error || '登录失败', false); return; }
      const token = data.token;
      if (!token) { btn.disabled = false; btn.textContent = '登录'; setMsg(msg, '登录成功但未返回 token', false); return; }
      const target = new URL(getRedirect());
      let ticket = null;
      try {
        const ex = await callFn('auth-exchange', { action: 'issue', token });
        if (ex.ok && ex.data && ex.data.ticket) ticket = ex.data.ticket;
      } catch (err) { ticket = null; }
      btn.textContent = '跳转中...';
      target.searchParams.set(ticket ? 'ticket' : 'token', ticket || token);
      location.href = target.toString();
    });

    // —— 通过 GitHub 登录（免登录态 OAuth） ——
    // Client ID 是 OAuth App 的公开标识（不是密钥），与 user/user.js 用同一个。
    // 回调地址复用 /user/github-callback.html，靠 state 前缀区分「登录 / 关联」，
    // 所以 GitHub 后台只需登记这一个 callback URL，无需改动 OAuth App 设置。
    const GH_CLIENT_ID = 'Ov23liK00mp7JPFFJ8PX';
    const GH_CALLBACK = location.origin + '/user/github-callback.html';
    const ghMsg = document.getElementById('ghMsg');
    const ghBtn = document.getElementById('ghLoginBtn');

    // 回调页在「该 GitHub 尚未关联本站账号」时会带错误回到这里
    const ghErr = qs.get('gh_error');
    if (ghErr) {
      setMsg(ghMsg, ghErr, false);
      try {
        const u = new URL(location.href);
        u.searchParams.delete('gh_error');
        history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch (e) {}
    }

    ghBtn.addEventListener('click', () => {
      if (!GH_CLIENT_ID) { setMsg(ghMsg, '管理员尚未配置 GitHub OAuth App', false); return; }
      const nonce = crypto.randomUUID ? crypto.randomUUID()
        : (String(Date.now()) + Math.random().toString(36).slice(2));
      const state = 'login:' + nonce;
      try {
        sessionStorage.setItem('gh_oauth_state', state);
        sessionStorage.setItem('gh_login_redirect', getRedirect());
      } catch (e) {
        setMsg(ghMsg, '浏览器存储不可用，请关闭隐私模式后重试', false); return;
      }
      const url = 'https://github.com/login/oauth/authorize?client_id=' + encodeURIComponent(GH_CLIENT_ID) +
        '&redirect_uri=' + encodeURIComponent(GH_CALLBACK) +
        '&scope=read:user&state=' + encodeURIComponent(state);
      location.href = url;
    });

    // 注册：提交后账号直接生效（status=approved），无需审核
    document.getElementById('applyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('applyMsg');
      const btn = document.getElementById('applyBtn');
      const username = document.getElementById('applyUsername').value.trim();
      const password = document.getElementById('applyPassword').value;
      const contact = document.getElementById('applyContact').value.trim();
      const reason = document.getElementById('applyReason').value.trim();
      if (!username || !password) { setMsg(msg, '请输入用户名和密码', false); return; }
      btn.disabled = true; btn.textContent = '提交中...';
      setMsg(msg, '', true);
      const { ok, data } = await callFn('apply', { username, password, contact, reason });
      btn.disabled = false; btn.textContent = '注册';
      if (!ok) { setMsg(msg, data.error || '注册失败', false); return; }
      e.target.reset();
      // 体验优化：注册成功后自动切到登录 tab、预填用户名、聚焦密码框
      document.querySelector('.tabs button[data-tab="login"]').click();
      document.getElementById('loginUsername').value = username;
      setMsg(document.getElementById('loginMsg'), (data.message || '注册成功') + '，请输入密码登录', true);
      document.getElementById('loginPassword').focus();
    });
  </script>
  <script src="/visit.js?v=20261107" defer></script>
</body>
</html>
