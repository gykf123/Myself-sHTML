<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聊天室 · FeSui</title>
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="FeSui 聊天室：登录后和站点上的朋友聊两句，消息公开可见。" />
  <link rel="icon" href="../favicon.png" />
  <link rel="stylesheet" href="../style.css?v=20261107b" />
  <link rel="stylesheet" href="../user/user.css?v=20261108" />
  <link rel="stylesheet" href="./chat.css?v=20261107" />
  <script>try{document.documentElement.classList.toggle('theme-glass',(localStorage.getItem('theme')||'glass')==='glass');}catch(e){document.documentElement.classList.add('theme-glass');}</script>
  <script src="/net-guard.js?v=20261107"></script>
  <script src="/site-nav.js?v=20261114b"></script>
</head>
<body>
  <div class="user-page">
    <header class="user-topbar">
      <a class="user-brand" href="../">
        <span class="user-logo" aria-hidden="true">F</span>
        <span class="user-brand-name">FeSui</span>
      </a>
      <nav class="user-topnav" aria-label="页面导航">
        <a href="../">主页</a>
        <a href="../#wall">留言墙</a>
        <a href="../user/">个人中心</a>
        <a href="../stats/">访问统计</a>
        <a href="./" class="active" aria-current="page">聊天室</a>
      </nav>
    </header>

    <main class="user-main">
      <section class="user-card chat-head-card">
        <h1 class="chat-title">💬 聊天室</h1>
        <p class="chat-sub">公共大厅所有人可见；私聊只有你和对方能看到。点昵称可以看 TA 的资料，也能直接发起私聊。</p>
        <div class="chat-tabs" role="tablist" aria-label="聊天模式">
          <button class="chat-tab active" data-chat-tab="public" type="button" role="tab" aria-selected="true">💬 公共大厅</button>
          <button class="chat-tab" data-chat-tab="dm" type="button" role="tab" aria-selected="false">✉️ 私聊 <span id="dmBadge" class="chat-tab-badge" hidden>0</span></button>
        </div>
        <div class="chat-status-row">
          <span id="chatConn" class="chat-conn">连接中…</span>
          <button id="chatRefresh" class="act-btn small" type="button">刷新</button>
        </div>
      </section>

      <div id="viewPublic">
        <section class="user-card chat-room-card">
          <div id="chatList" class="chat-list" aria-live="polite">
            <div class="user-loading">正在加载消息…</div>
          </div>
        </section>

        <section class="user-card chat-compose-card">
          <div id="chatComposer"></div>
        </section>
      </div>

      <div id="viewDm" hidden>
        <section class="user-card dm-card">
          <div class="dm-layout">
            <aside class="dm-side">
              <div class="dm-start-row">
                <input id="dmPeerInput" class="chat-input dm-peer-input" type="text" maxlength="60" placeholder="输入用户名发起私聊" aria-label="对方用户名" />
                <button id="dmStart" class="act-btn small" type="button">发起</button>
              </div>
              <div id="dmConvList" class="dm-conv-list" aria-live="polite">
                <div class="user-loading">加载会话…</div>
              </div>
            </aside>
            <div class="dm-main">
              <div id="dmHead" class="dm-head">从左侧选一个会话，或输入用户名发起私聊</div>
              <div id="dmList" class="chat-list dm-list" aria-live="polite"></div>
              <div id="dmComposer" class="dm-composer"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer class="user-foot">
      <span>© <span id="footYear"></span> FeSui</span>
      <span class="user-foot-sep">·</span>
      <a href="../">返回主页</a>
    </footer>
  </div>

  <script src="/auth-ticket.js?v=20261107" defer></script>
  <script src="./chat.js?v=20261107c" defer></script>
  <script src="/visit.js?v=20261107" defer></script>
</body>
</html>
